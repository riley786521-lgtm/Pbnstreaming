<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBN Standings</title><style>*{box-sizing:border-box}body{margin:0;background:#050f1b;color:#fff;font-family:Arial,sans-serif}header{height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#071b30;border-bottom:1px solid #163653}.logo{font-size:32px;font-weight:900}.logo b{color:#06f}nav a{color:#cbd8e6;text-decoration:none;margin-left:22px;font-weight:700}.wrap{width:min(1000px,92%);margin:45px auto}.eyebrow{color:#4ea1ff;font-weight:900;letter-spacing:1px}h1{font-size:52px;margin:8px 0 35px}.table{background:#0b2138;border:1px solid #173b5c;border-radius:10px;overflow:hidden}.row{display:grid;grid-template-columns:70px 1fr 80px 80px 90px;padding:18px 22px;align-items:center;border-bottom:1px solid #17324a}.row:last-child{border:0}.head{background:#071b30;color:#91a8bf;font-size:13px;font-weight:900}.rank{font-weight:900;color:#4ea1ff}.team{font-size:20px;font-weight:900}.num{text-align:center;font-weight:800}.pct{text-align:center;font-weight:900}.note{margin-top:15px;color:#8197aa;font-size:14px}@media(max-width:600px){h1{font-size:40px}.row{grid-template-columns:45px 1fr 45px 45px 60px;padding:15px 10px}.team{font-size:16px}.head{font-size:11px}nav{display:none}}</style></head><body><header><div class="logo">P<b>B</b>N</div><nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="replays.html">Replays</a><a href="broadcast-team.html">Team</a></nav></header><main class="wrap"><div class="eyebrow">PRIME BROADCAST NETWORK</div><h1>Standings</h1><section class="table"><div class="row head"><div>#</div><div>TEAM</div><div class="num">W</div><div class="num">L</div><div class="pct">PCT</div></div><div id="rows"></div></section><div class="note">Records are ready to be updated as PBN games are completed.</div></main><script>const teams=['Atlanta','Philadelphia','Pittsburgh','Carolina','Seattle','Dallas','Arizona'];document.getElementById('rows').innerHTML=teams.map((t,i)=>`<div class="row"><div class="rank">${i+1}</div><div class="team">🏈 ${t}</div><div class="num">0</div><div class="num">0</div><div class="pct">.000</div></div>`).join('');</script></body></html>
