<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBN Replays</title><style>*{box-sizing:border-box}body{margin:0;background:#050f1b;color:#fff;font-family:Arial,sans-serif}header{height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#071b30;border-bottom:1px solid #163653}.logo{font-size:32px;font-weight:900}.logo b{color:#06f}nav a{color:#cbd8e6;text-decoration:none;margin-left:22px;font-weight:700}.wrap{width:min(1100px,90%);margin:45px auto}.eyebrow{color:#4ea1ff;font-weight:900;letter-spacing:1px}h1{font-size:52px;margin:8px 0 35px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.card{background:#0b2138;border:1px solid #173b5c;border-radius:10px;overflow:hidden}.thumb{height:170px;background:#071523;display:flex;align-items:center;justify-content:center;font-size:46px}.body{padding:20px}.teams{font-size:24px;font-weight:900}.date{color:#9eb2c7;margin:8px 0 18px}.btn{display:inline-block;padding:11px 16px;background:#06f;color:#fff;text-decoration:none;border-radius:6px;font-weight:900}.empty{color:#9eb2c7}@media(max-width:700px){h1{font-size:40px}.grid{grid-template-columns:1fr}nav{display:none}}</style></head><body><header><div class="logo">P<b>B</b>N</div><nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="replays.html">Replays</a></nav></header><main class="wrap"><div class="eyebrow">PRIME BROADCAST NETWORK</div><h1>Game Replays</h1><div class="grid" id="replays"><div class="empty">No replays added yet.</div></div></main><script>const replays=[{team1:'PBN Featured Game',team2:'Full Game Replay',date:'Coming soon',url:'#'},{team1:'PBN Highlights',team2:'Game Highlights',date:'Coming soon',url:'#'}];document.getElementById('replays').innerHTML=replays.map((r,i)=>`<article class="card"><div class="thumb">▶️</div><div class="body"><div class="teams">${r.team1} • ${r.team2}</div><div class="date">${r.date}</div><a class="btn" href="${r.url}">WATCH REPLAY</a></div></article>`).join('');</script></body></html>
