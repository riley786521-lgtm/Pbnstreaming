<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PBN Sports | Replays</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050912;color:#fff;font-family:Arial,Helvetica,sans-serif}a{color:inherit}
header{height:74px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#070d18;border-bottom:1px solid #18243a;position:sticky;top:0;z-index:10}.logo{font-size:30px;font-weight:950;letter-spacing:-2px}.logo b{color:#1646ff}nav a{color:#aebbd0;text-decoration:none;margin-left:25px;font-weight:800;font-size:14px}nav a:hover,nav a.active{color:#fff}.wrap{width:min(1180px,90%);margin:58px auto 90px}.eyebrow{color:#5f84ff;font-weight:900;letter-spacing:1.8px;font-size:13px}h1{font-size:clamp(42px,6vw,68px);line-height:1;margin:10px 0 14px;letter-spacing:-2px}.sub{color:#8998ad;font-size:17px;margin:0 0 38px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.card{background:linear-gradient(145deg,#0d1524,#080e19);border:1px solid #1a2940;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #0005}.thumb{height:220px;background:linear-gradient(135deg,#0b1220,#101d34);display:flex;align-items:center;justify-content:center;position:relative}.thumb:after{content:'PBN';font-size:86px;font-weight:950;letter-spacing:-6px;color:#1646ff22}.play{position:absolute;width:66px;height:66px;border-radius:50%;background:#1646ff;display:grid;place-items:center;font-size:25px;padding-left:4px;box-shadow:0 10px 30px #1646ff66}.body{padding:25px}.tag{display:inline-block;background:#1646ff18;color:#6e8cff;border:1px solid #1646ff44;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:1px;margin-bottom:13px}.teams{font-size:25px;font-weight:950;letter-spacing:-.5px}.date{color:#8392a8;margin:9px 0 21px}.btn{display:inline-block;padding:12px 18px;background:#1646ff;text-decoration:none;border-radius:9px;font-weight:900;font-size:13px}.btn:hover{filter:brightness(1.12)}footer{border-top:1px solid #18243a;color:#68778d;padding:28px 6%;font-size:13px}@media(max-width:700px){nav{display:none}.wrap{margin-top:40px}.grid{grid-template-columns:1fr}.thumb{height:190px}}
</style>
</head>
<body>
<header><div class="logo">P<b>B</b>N</div><nav><a href="index.html">HOME</a><a href="watch.html">WATCH LIVE</a><a href="schedule.html">SCHEDULE</a><a class="active" href="replays.html">REPLAYS</a><a href="standings.html">STANDINGS</a></nav></header>
<main class="wrap"><div class="eyebrow">PRIME BROADCAST NETWORK</div><h1>Game Replays</h1><p class="sub">Catch up on PBN broadcasts, featured games, and highlights.</p><div class="grid" id="replays"></div></main>
<footer>PBN SPORTS — WHERE THE GAME COMES ALIVE. 🏈</footer>
<script>
async function loadReplays(){
  const box=document.getElementById('replays');
  try{
    const res=await fetch('data/replays.json?'+Date.now());
    const data=await res.json();
    const replays=data.replays||[];
    if(!replays.length){box.innerHTML='<p class="sub">No replays available yet.</p>';return;}
    box.innerHTML=replays.map(r=>`<article class="card"><div class="thumb"><div class="play">▶</div></div><div class="body"><div class="tag">${r.type||'REPLAY'}</div><div class="teams">${r.title||'PBN Replay'}</div><div class="date">${r.date||''}</div>${r.url&&r.url!=='#'?`<a class="btn" href="${r.url}" target="_blank" rel="noopener">WATCH REPLAY →</a>`:'<span class="btn" style="opacity:.55;cursor:not-allowed">COMING SOON</span>'}</div></article>`).join('');
  }catch(e){box.innerHTML='<p class="sub">Replays are temporarily unavailable.</p>';}
}
loadReplays();
</script>
</body>
</html>
