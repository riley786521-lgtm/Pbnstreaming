<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBN Admin — Matchups</title><style>*{box-sizing:border-box}body{margin:0;background:#061526;color:#fff;font-family:Arial,sans-serif}header{padding:18px 7%;background:#071b30;border-bottom:1px solid #163653}.logo{font-size:30px;font-weight:900}.logo b{color:#06f}main{max-width:1000px;margin:auto;padding:35px 6%}.panel{background:#0b2138;border:1px solid #173b5c;border-radius:12px;padding:25px;margin-bottom:20px}h1{font-size:40px;margin:0 0 8px}.muted{color:#9eb2c7}.game{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:12px;align-items:end;margin-top:18px}.field label{display:block;font-size:12px;color:#9eb2c7;margin-bottom:6px;font-weight:700}.field input,.field select{width:100%;padding:12px;border-radius:7px;border:1px solid #315473;background:#061526;color:#fff}.btn{border:0;border-radius:7px;padding:12px 18px;font-weight:900;cursor:pointer}.save{background:#06f;color:#fff}.reset{background:#24394d;color:#fff;margin-left:8px}.msg{margin-top:15px;font-weight:700}.note{font-size:13px;color:#8fa5ba;line-height:1.5}@media(max-width:700px){.game{grid-template-columns:1fr}.reset{margin:8px 0 0}}
</style></head><body><header><div class="logo">P<b>B</b>N ADMIN</div></header><main><div class="panel"><h1>Matchup Editor 🏈</h1><p class="muted">Set the games displayed on your PBN schedule.</p><div id="games"></div><button class="btn save" onclick="save()">SAVE MATCHUPS</button><button class="btn reset" onclick="resetGames()">RESET</button><div id="msg" class="msg"></div></div><div class="panel"><h2>How it works</h2><p class="note">Choose the two teams, enter the broadcast time, then save. Your settings are stored in this browser for now. A secure shared database can be connected next so changes appear for every viewer.</p></div></main><script>
const teams=['Atlanta','Arizona','Baltimore','Buffalo','Carolina','Chicago','Cincinnati','Cleveland','Dallas','Denver','Detroit','Green Bay','Houston','Indianapolis','Jacksonville','Kansas City','Las Vegas','LA Chargers','LA Rams','Miami','Minnesota','New England','New Orleans','NY Giants','NY Jets','Philadelphia','Pittsburgh','San Francisco','Seattle','Tampa Bay','Tennessee','Washington'];
const defaults=[['Atlanta','Philadelphia','Tonight • 9:00 PM'],['Pittsburgh','Carolina','Schedule coming soon'],['Seattle','Dallas','Schedule coming soon'],['Seattle','Arizona','Schedule coming soon']];
function options(v){return teams.map(t=>`<option ${t===v?'selected':''}>${t}</option>`).join('')}
function render(){let data=JSON.parse(localStorage.getItem('pbnMatchups')||'null')||defaults;document.getElementById('games').innerHTML=data.map((g,i)=>`<div class="game"><div class="field"><label>TEAM 1</label><select id="a${i}">${options(g[0])}</select></div><div class="field"><label>TEAM 2</label><select id="b${i}">${options(g[1])}</select></div><div class="field"><label>DATE / TIME</label><input id="t${i}" value="${g[2].replaceAll('"','&quot;')}"></div><div class="field"><label>#${i+1}</label></div></div>`).join('')}
function save(){let data=[0,1,2,3].map(i=>[document.getElementById('a'+i).value,document.getElementById('b'+i).value,document.getElementById('t'+i).value]);localStorage.setItem('pbnMatchups',JSON.stringify(data));document.getElementById('msg').textContent='✅ Matchups saved on this device!';}
function resetGames(){localStorage.removeItem('pbnMatchups');render();document.getElementById('msg').textContent='↩️ Reset to the default matchups.'}
render();</script></body></html>
