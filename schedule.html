<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBN Schedule — Prime Broadcast Network</title><style>:root{--blue:#1646ff;--bg:#050912;--panel:#0b1220;--line:#1b2940;--muted:#91a0b7;--white:#f7f9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}a{color:inherit;text-decoration:none}header{height:76px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#050912;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font-size:30px;font-weight:950;letter-spacing:-2px}.logo span{color:var(--blue)}nav{display:flex;gap:28px}nav a{color:#b9c5d8;font-size:14px;font-weight:800}.wrap{max-width:1150px;margin:auto;padding:55px 5%}.eyebrow{color:#8eacff;font-size:12px;font-weight:900;letter-spacing:1.2px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}h1{font-size:56px;letter-spacing:-3px;margin:8px 0 0}.sub{color:var(--muted);max-width:600px;line-height:1.6}.status{color:#718097;font-size:12px;font-weight:800}.games{display:grid;gap:16px}.game{padding:24px;background:linear-gradient(145deg,#0c1524,#09111d);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:20px}.game:hover{border-color:#2c4770}.teams{font-size:25px;font-weight:900}.time{margin-top:8px;color:var(--muted);font-weight:700}.badge{display:inline-block;margin-bottom:10px;padding:6px 9px;border-radius:6px;background:#12213a;color:#9fbbff;font-size:11px;font-weight:900}.watch{padding:12px 18px;background:var(--blue);border-radius:8px;font-weight:900;white-space:nowrap}.empty{padding:25px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}footer{padding:35px 5%;border-top:1px solid var(--line);color:#6f7f97;font-size:13px;display:flex;justify-content:space-between}@media(max-width:650px){h1{font-size:42px}.hero{display:block}.game{display:block}.watch{display:inline-block;margin-top:18px}nav{display:none}footer{display:block}}
</style></head><body><header><a class="logo" href="index.html">P<span>B</span>N</a><nav><a href="index.html">HOME</a><a href="watch.html">WATCH LIVE</a><a class="active" href="schedule.html">SCHEDULE</a><a href="replays.html">REPLAYS</a><a href="standings.html">STANDINGS</a></nav></header><main class="wrap"><div class="hero"><div><div class="eyebrow">PRIME BROADCAST NETWORK</div><h1>Game Schedule</h1><p class="sub">Find upcoming PBN Football Fusion broadcasts and jump into the next live game.</p></div><div class="status" id="status">UPDATING...</div></div><div class="games" id="games"><div class="empty">Loading schedule...</div></div></main><footer><span>© PBN • Prime Broadcast Network</span><span>Football coverage • Live broadcasts • Replays</span></footer><script>
async function loadSchedule(){try{const r=await fetch('data/matchups.json?cache='+Date.now());if(!r.ok)throw new Error();const data=await r.json();const games=data.games||[];const el=document.getElementById('games');el.innerHTML='';if(!games.length){el.innerHTML='<div class="empty">No games scheduled yet.</div>';document.getElementById('status').textContent='NO GAMES SCHEDULED';return}games.forEach((g,i)=>{const d=document.createElement('div');d.className='game';d.innerHTML='<div><span class="badge">'+(i===0?'NEXT PBN GAME':'UPCOMING')+'</span><div class="teams">🏈 '+g.team1+' vs '+g.team2+'</div><div class="time">'+g.time+'</div></div>'+(i===0?'<a class="watch" href="watch.html">WATCH LIVE →</a>':'');el.appendChild(d)});document.getElementById('status').textContent='LIVE SCHEDULE DATA'}catch(e){document.getElementById('games').innerHTML='<div class="empty">Unable to load schedule.</div>';document.getElementById('status').textContent='SCHEDULE UNAVAILABLE'}}loadSchedule();setInterval(loadSchedule,60000);
</script></body></html>
