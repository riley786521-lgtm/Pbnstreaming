<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PBN Schedule</title><style>*{box-sizing:border-box}body{margin:0;background:#050f1b;color:#fff;font-family:Arial,sans-serif}header{height:72px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#071b30;border-bottom:1px solid #163653}.logo{font-size:32px;font-weight:900}.logo b{color:#06f}nav a{color:#cbd8e6;text-decoration:none;margin-left:22px;font-weight:700}.wrap{width:min(1100px,90%);margin:45px auto}.eyebrow{color:#4ea1ff;font-weight:900;letter-spacing:1px}h1{font-size:52px;margin:8px 0 35px}.games{display:grid;gap:18px}.game{padding:24px;background:#0b2138;border:1px solid #173b5c;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:20px}.teams{font-size:25px;font-weight:900}.time{margin-top:8px;color:#9eb2c7;font-weight:700}.badge{display:inline-block;margin-bottom:10px;padding:5px 9px;border-radius:5px;background:#163b5d;color:#9fc9ff;font-size:12px;font-weight:900}.watch{padding:12px 18px;background:#06f;color:#fff;text-decoration:none;border-radius:6px;font-weight:900;white-space:nowrap}.empty{color:#9eb2c7}@media(max-width:650px){h1{font-size:40px}.game{display:block}.watch{display:inline-block;margin-top:18px}nav{display:none}}</style></head><body><header><div class="logo">P<b>B</b>N</div><nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="watch.html">Live</a></nav></header><main class="wrap"><div class="eyebrow">PRIME BROADCAST NETWORK</div><h1>Game Schedule</h1><div class="games" id="games"><div class="empty">Loading schedule...</div></div></main><script>fetch('data/matchups.json?'+Date.now()).then(r=>r.json()).then(data=>{const games=data.games||[];const el=document.getElementById('games');el.innerHTML='';if(!games.length){el.innerHTML='<div class="empty">No games scheduled yet.</div>';return}games.forEach((g,i)=>{const d=document.createElement('div');d.className='game';d.innerHTML='<div><span class="badge">'+(i===0?'FEATURED':'UPCOMING')+'</span><div class="teams">🏈 '+g.team1+' vs '+g.team2+'</div><div class="time">'+g.time+'</div></div>'+(i===0?'<a class="watch" href="watch.html">WATCH LIVE</a>':'');el.appendChild(d)})}).catch(()=>document.getElementById('games').innerHTML='<div class="empty">Unable to load schedule.</div>');</script></body></html>
